# YOLOv5-TPH + LSKAttention + C3k2PPA
# Parameters
nc: 80 
depth_multiple: 1.0 
width_multiple: 1.0 
anchors: 4 

# Backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],    # 1-P2/4
   [-1, 3, C3, [128]],            # 2-P2特征来源
   [-1, 1, Conv, [256, 3, 2]],    # 3-P3/8
   [-1, 6, C3k2, [256]],       # 4 (替换为PPA)
   [-1, 1, Conv, [512, 3, 2]],    # 5-P4/16
   [-1, 9, C3k2, [512]],       # 6 (替换为PPA)
   [-1, 1, Conv, [1024, 3, 2]],   # 7-P5/32
   [-1, 3, C3, [1024]],           # 8
   [-1, 1, SPPF, [1024, 5]],      # 9
  ]

# Head
head:
  [[-1, 1, Conv, [512, 1, 1]],                 # 10
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 11
   [[-1, 6], 1, Concat, [1]],                  # 12 连主干P4
   [-1, 3, C3, [512, False]],                  # 13

   [-1, 1, Conv, [256, 1, 1]],                 # 14
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 15
   [[-1, 4], 1, Concat, [1]],                  # 16 连主干P3
   [-1, 3, C3, [256, False]],                  # 17 (P3/8)
   
   # === P3 分支 ===
   [-1, 1, LSKAttention, []],                  # 18
   
   [-1, 1, Conv, [256, 3, 2]],                 # 19
   [[-1, 14], 1, Concat, [1]],                 # 20 连Layer 14
   [-1, 3, C3, [512, False]],                  # 21 (P4/16)
   
   # === P4 分支 ===
   [-1, 1, LSKAttention, []],                  # 22
   
   [-1, 1, Conv, [512, 3, 2]],                 # 23
   [[-1, 10], 1, Concat, [1]],                 # 24 连Layer 10
   [-1, 1, C3k2PPA, [1024, False]],            # 25 (末端换PPA)
   
   # === P5 分支 ===
   [-1, 1, LSKAttention, []],                  # 26
   
   # === P2 分支 (Tiny Head) ===
   [2, 1, LSKAttention, []],                   # 27 连Layer 2
   
   # Detect [P2, P3, P4, P5]
   [[27, 18, 22, 26], 1, CLLADetect, [nc, anchors]], 
  ]