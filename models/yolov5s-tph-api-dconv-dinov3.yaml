# YOLOv5-TPH + DINOv3 ConvNeXt Backbone (Teacher Model for Distillation)
#
# Architecture: DINOv3 ConvNeXt-Large backbone + YOLOv5-TPH head
# Purpose: Train as teacher model, then distill into yolov5s-tph-api-dconv (student)
#
# Usage:
#   # Train teacher model:
#   python train.py --cfg models/yolov5s-tph-api-dconv-dinov3.yaml --data anti-uav.yaml
#
#   # Load DINOv3 pretrained weights (set env var before training):
#   export DINOV3_WEIGHTS=/path/to/dinov3_convnext_large.pth
#
#   # Or load weights programmatically after model creation:
#   model.model[0].load_dinov3_weights('/path/to/dinov3_convnext_large.pth')
#   model.model[0].freeze_backbone()  # optional: freeze backbone initially

nc: 80
anchors: 4
scales:
  teacher: [1.00, 1.00, 1024]
scale: teacher

# DINOv3 ConvNeXt-Large backbone
# Outputs 4-scale features: stride [4, 8, 16, 32], channels [128, 256, 512, 1024]
backbone:
  [[-1, 1, DINOv3ConvNeXt, ['large', 128, 256, 512, 1024]],  # 0: full backbone, outputs tuple
   [0, 1, Index, [0, 128]],     # 1: stride 4, 128ch
   [0, 1, Index, [1, 256]],     # 2: stride 8, 256ch
   [0, 1, Index, [2, 512]],     # 3: stride 16, 512ch
   [0, 1, Index, [3, 1024]],    # 4: stride 32, 1024ch
   [-1, 1, SPPF, [1024, 5]],    # 5: stride 32, 1024ch
  ]

# Head: same structure as yolov5s-tph-api-dconv (FPN/PAN + DNResBlock + CLLADetect)
head:
  [[-1, 1, Conv, [512, 1, 1]],                    # 6
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],    # 7
   [[-1, 3], 1, Concat, [1]],                     # 8: concat with stride16 (512ch)
   [-1, 3, C3, [512, False]],                     # 9

   [-1, 1, Conv, [256, 1, 1]],                    # 10
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],    # 11
   [[-1, 2], 1, Concat, [1]],                     # 12: concat with stride8 (256ch)
   [-1, 3, C3, [256, False]],                     # 13

   [-1, 1, DNResBlock, [4, 3]],                   # 14: P3, stride 8

   [-1, 1, DConv, [256, 3, 2, 2]],                # 15
   [[-1, 10], 1, Concat, [1]],                    # 16
   [-1, 3, C3, [512, False]],                     # 17

   [-1, 1, DNResBlock, [4, 5]],                   # 18: P4, stride 16

   [-1, 1, DConv, [512, 3, 2, 2]],                # 19
   [[-1, 6], 1, Concat, [1]],                     # 20
   [-1, 1, C3STR, [1024, False]],                 # 21

   [-1, 1, DNResBlock, [4, 5]],                   # 22: P5, stride 32

   [1, 1, DNResBlock, [4, 3]],                    # 23: P2, stride 4

   [[23, 14, 18, 22], 1, CLLADetect, [nc, anchors]],  # 24: 4-scale detection
  ]
