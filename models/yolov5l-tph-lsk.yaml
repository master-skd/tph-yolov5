# YOLOv5-TPH + LSKAttention
# Parameters
nc: 80  # number of classes
depth_multiple: 1.0  # model depth multiple
width_multiple: 1.0  # layer channel multiple
anchors: 4  # TPH 4个头

# Backbone (保持不变)
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]],          # 2 (这里是 P2 特征来源)
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3, [1024]],
   [-1, 1, SPPF, [1024, 5]],  # 9
  ]

# Head (插入 LSKAttention)
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 13

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 17 (P3/8-small)
   
   # === 【插入点 1】P3 分支 ===
   [-1, 1, LSKAttention, []],  # 18 (增强后的 P3)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 14], 1, Concat, [1]], # cat head P4 (注意：连的是 Layer 14，不受上面插入影响)
   [-1, 3, C3, [512, False]],  # 21 (P4/16-medium)

   # === 【插入点 2】P4 分支 ===
   [-1, 1, LSKAttention, []],  # 22 (增强后的 P4)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 10], 1, Concat, [1]], # cat head P5
   [-1, 1, C3STR, [1024, False]], # 25 (P5/32-large)

   # === 【插入点 3】P5 分支 ===
   [-1, 1, LSKAttention, []],  # 26 (增强后的 P5)

   # === 【插入点 4】P2 分支 (Tiny Head) ===
   # TPH 原版直接用 Backbone P2 (index 2)，我们在这里加一层处理
   [2, 1, LSKAttention, []],   # 27 (从 Layer 2 获取并增强，成为新的 P2)

   # Detect [P2, P3, P4, P5]
   # 索引变化：
   # P2 -> 27 (新加的)
   # P3 -> 18 (新加的)
   # P4 -> 22 (新加的)
   # P5 -> 26 (新加的)
   [[27, 18, 22, 26], 1, CLLADetect, [nc, anchors]], 
  ]